rules:
  - id: PS-001
    name: PowerShell encoded command
    description: PowerShell launched with an encoded (base64) command line.
    severity: high
    type: match
    mitre: [T1059.001, T1027]
    match:
      - {field: process_name, op: regex, value: '^(powershell|pwsh)(\.exe)?$'}
      - {field: command_line, op: regex, value: '\s-(e|ec|enc|encodedcommand)\s+[A-Za-z0-9+/=]{20,}'}
    caution: Some management tools legitimately use encoded commands.

  - id: PS-002
    name: PowerShell download cradle
    description: PowerShell command line that downloads or executes remote content.
    severity: high
    type: match
    mitre: [T1059.001, T1105]
    match:
      - {field: process_name, op: regex, value: '^(powershell|pwsh)(\.exe)?$'}
    match_any:
      - {field: command_line, op: regex, value: 'downloadstring|downloadfile|net\.webclient|invoke-webrequest|\biwr\b|start-bitstransfer|invoke-expression|\biex\b'}
    caution: PowerShell is widely used for legitimate administration and software deployment.

  - id: PS-003
    name: PowerShell with execution-policy bypass or hidden window
    description: PowerShell started with flags commonly used to avoid prompts or visibility.
    severity: medium
    type: match
    mitre: [T1059.001]
    match:
      - {field: process_name, op: regex, value: '^(powershell|pwsh)(\.exe)?$'}
      - {field: command_line, op: regex, value: '-(ep|executionpolicy)\s+bypass|-w(indowstyle)?\s+hidden|-nop\b'}
    caution: Admin scripts and installers sometimes use the same flags. Review the script content.
